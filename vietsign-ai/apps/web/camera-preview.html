<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VietSignAI Camera Preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101418;
        color: #f7fafc;
        display: grid;
        place-items: center;
      }
      main {
        width: min(960px, calc(100vw - 32px));
      }
      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #05070a;
        border: 1px solid #2d3748;
        transform: scaleX(-1);
      }
      button {
        margin-top: 16px;
        margin-right: 8px;
        padding: 10px 14px;
        border: 1px solid #4a5568;
        background: #edf2f7;
        color: #111827;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VietSignAI Camera Preview</h1>
      <video id="camera" autoplay muted playsinline></video>
      <div>
        <button id="start">Bật camera</button>
        <button id="stop">Tắt</button>
      </div>
      <p id="status">Sẵn sàng. Trang này chỉ mở camera preview, chưa nhận dạng/dịch cử chỉ.</p>
    </main>
    <script>
      const camera = document.getElementById("camera");
      const status = document.getElementById("status");
      let stream = null;

      document.getElementById("start").addEventListener("click", async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          camera.srcObject = stream;
          status.textContent = "Camera đang bật.";
        } catch (error) {
          status.textContent = `Không mở được camera: ${error}`;
        }
      });

      document.getElementById("stop").addEventListener("click", () => {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        camera.srcObject = null;
        status.textContent = "Camera đã tắt.";
      });
    </script>
  </body>
</html>
