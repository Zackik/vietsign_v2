seed: 42
run:
  name: transformer_baseline
  output_dir: outputs/runs

dataset:
  config: configs/data/vsl400.yaml
  cache_root: data/cache/keypoints
  expected_fingerprint: null
  split_strategy: signer_independent

sequence:
  mode: fixed
  length: 64

features:
  left_hand: true
  right_hand: true
  pose: true
  validity: true
  confidence: false
  source_mask: false
  velocity: false

data_quality:
  minimum_valid_joint_ratio: 0.05
  reject_empty: true

model:
  type: temporal_transformer
  embedding_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  positional_encoding: sinusoidal

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  device: auto

optimizer:
  type: adamw

scheduler:
  type: none

loss:
  class_weighting: none

early_stopping:
  enabled: true
  patience: 10
  metric: macro_f1

evaluation:
  fail_on_signer_overlap: false
  top_k: 5

