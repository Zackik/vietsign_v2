model:
  type: temporal_transformer
  embedding_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  positional_encoding: sinusoidal

sequence:
  mode: fixed
  length: 64

features:
  left_hand: true
  right_hand: true
  pose: true
  validity: true
  confidence: false
  source_mask: false
  velocity: false

