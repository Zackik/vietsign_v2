dataset_config: configs/data/vsl400.yaml

extractor:
  type: rtmpose
  hands: true
  pose: true
  face: false

rtmpose:
  runtime: rtmlib
  mode: balanced
  backend: onnxruntime
  device: cpu
  keypoint_threshold: 0.3
  det_model: models/rtmpose/yolox_m_8xb8-300e_humanart-c2c7a14a.onnx
  pose_model: models/rtmpose/rtmw-dw-x-l_simcc-cocktail14_270e-256x192_20231122.onnx

video:
  target_fps: 25
  num_frames: 64
  sampling: uniform

normalization:
  type: body_relative

interpolation:
  enabled: true
  max_gap: 3

smoothing:
  enabled: false
  type: ema
  alpha: 0.6

features:
  velocity: true
  acceleration: false

cache:
  enabled: true
  root: data/cache/keypoints
  reuse: true

warnings:
  hand_coverage_threshold: 0.5
