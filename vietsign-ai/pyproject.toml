[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietsign-ai"
version = "0.1.0"
description = "Foundation for Vietnamese Sign Language recognition and translation research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VietSignAI Contributors" }]
dependencies = [
  "torch>=2.2",
  "opencv-python>=4.8",
  "mediapipe>=0.10.21,<1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "pydantic>=2.5",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=7.4", "ruff>=0.3"]
tracking = ["mlflow>=2.10", "wandb>=0.16"]
transformers = ["transformers>=4.38", "huggingface-hub>=0.23", "accelerate>=0.27"]
pose = [
  "mmpose>=1.3",
  "mmcv>=2.1",
  "mmdet>=3.3",
]
rtmpose = [
  "rtmlib>=0.0.16",
  "onnxruntime>=1.17",
]

[project.scripts]
vietsign = "vietsign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
